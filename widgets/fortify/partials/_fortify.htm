<?php

use Wobqqq\Fortify\Dto\WidgetItemLinkDto;

?>
<div class="report-widget">
    <h3>
        <i class="icon-shield"></i> <?= e(__($this->property('title'))) ?>
    </h3>

    <?php foreach ($groups as $group): ?>
        <div class="header">
            <h3>
                <?php if (!empty($group->icon)): ?><i class="<?= e($group->icon) ?>"></i><?php endif ?>
                <?= e(trans($group->name)) ?>
            </h3>
        </div>
        <div class="control-status-list mb-5">
            <?php if (!empty($group->list)): ?>
                <ul>
                    <?php foreach ($group->list as $item): ?>
                        <li>
                            <?php if (!empty($item->icon)): ?>
                                <span class="status-icon <?= e($item->color->statusClass()) ?>">
                                    <i class="<?= e($item->icon) ?>"></i>
                                </span>
                            <?php endif ?>
                            <span class="status-text <?= e($item->color->statusClass()) ?>">
                                <?= trans($item->name) ?>
                            </span>
                            <?php foreach ($item->buttons as $button): ?>
                                <?php if ($button instanceof WidgetItemLinkDto): ?>
                                    <a
                                        <?php if (!empty($button->target)): ?>target="<?= e($button->target) ?>" rel="noopener noreferrer"<?php endif ?>
                                        href="<?= e($button->link) ?>"
                                        class="me-2 status-label btn btn-sm btn-outline-<?= e($item->color->buttonClass()) ?>"
                                    >
                                        <?php if (!empty($button->icon)): ?><i class="<?= e($button->icon) ?>"></i><?php endif ?><?= e(trans($button->name)) ?>
                                    </a>
                                <?php else: ?>
                                    <button
                                        type="button"
                                        data-request-data="<?= e(json_encode(['_dash_definition' => 'system', 'action' => $button->action], JSON_THROW_ON_ERROR)) ?>"
                                        data-control="popup"
                                        data-handler="onFortifyAction"
                                        class="me-2 fortify-button fortify-open-modal fortify-action status-label btn btn-sm btn-outline-<?= e($item->color->buttonClass()) ?>"
                                    >
                                        <?php if (!empty($button->icon)): ?><i class="<?= e($button->icon) ?>"></i><?php endif ?><?= e(trans($button->name)) ?>
                                    </button>
                                <?php endif ?>
                            <?php endforeach ?>
                        </li>
                    <?php endforeach ?>
                </ul>
            <?php endif ?>
        </div>
    <?php endforeach ?>
</div>
